# =========================================================================
# Réseau bayésien — gestion de l'incertitude
# =========================================================================
#
# Hypothèse simplificatrice du cours : les causes sont mutuellement
# exclusives en première approximation (une seule cause "vraie" à la fois).
# On modélise donc un réseau de type "naïf" :
#
#     P(Cause | Observations) ∝ P(Cause) × Π_i P(Observation_i | Cause)
#
# - "prior" : probabilité a priori P(Cause), les taux de base restent
#   visibles et documentés (cf. point souligné dans le cours sur les
#   "base rates").
# - "cpt" : table de probabilité conditionnelle P(valeur_observation | Cause).
#   Une observation absente du dictionnaire d'une cause est considérée
#   non informative (probabilité neutre = 1) : elle ne pénalise ni ne
#   favorise la cause -> gère l'incomplétude sans forcer de valeur.
# - Les CPT sont estimées à dire d'expert (techniciens) + retour terrain,
#   comme indiqué dans le document de cadrage.

causes:
  fuite_majeure:
    prior: 0.12
    cpt:
      pression: {basse: 0.90, normale: 0.08, haute: 0.02}
      debit: {nul: 0.55, faible: 0.35, normal: 0.10}
      turbidite: {elevee: 0.15, normale: 0.85}
      plaintes_gout: {oui: 0.10, non: 0.90}
      pompe_alarme: {oui: 0.05, non: 0.95}
      tension_anormale: {oui: 0.05, non: 0.95}
      pompe_etat: {ok: 0.90, hs: 0.10}

  fuite_secondaire:
