# Actions recommandées associées à chaque cause (utilisées par le module
# d'explication pour produire une conclusion actionnable).
actions:
  fuite_majeure: "Déclencher une intervention terrain prioritaire (recherche de fuite majeure sur le tronçon amont)."
  fuite_secondaire: "Planifier une inspection du réseau secondaire (recherche de fuite progressive) sous 48h."
  vanne_fermee: "Vérifier l'état des vannes du secteur concerné et les réouvrir si fermeture accidentelle."
  panne_pompe_mecanique: "Envoyer une équipe de maintenance mécanique pour inspecter la pompe."
  panne_electrique_pompe: "Envoyer une équipe électrique ; couper l'alimentation avant intervention."
  contamination: "Alerte sanitaire : suspendre la distribution du secteur et lancer une analyse d'eau immédiate."
  capteur_defaillant: "Planifier une vérification/étalonnage du capteur ; ne pas déclencher d'intervention lourde sans confirmation."
  ras: "Aucune action requise ; poursuivre la surveillance normale."
